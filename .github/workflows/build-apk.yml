name: Build NerdyDesk APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unzip if needed)
        run: |
          if [ -f settings.gradle.kts ]; then
            ROOT=.
          else
            mkdir -p _unz
            Z=NerdyDesk-source.zip
            [ -f "$Z" ] || Z=$(ls *.zip | head -1)
            echo "Using $Z"
            unzip -q -o "$Z" -d _unz
            ROOT=$(dirname "$(find _unz -name settings.gradle.kts | head -1)")
          fi
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses (SDK is preinstalled on the runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$SDK" > "$ROOT/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: |
          set -o pipefail
          cd "$ROOT" && gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the error at the top of the run page (only if the build failed)
        if: failure()
        run: |
          {
            echo "## Build error"
            echo '```'
            grep -n -E "^e: |error:|AAPT|What went wrong|Execution failed|FAILED|Caused by" -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/NerdyDesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NerdyDesk-apk
          path: out/NerdyDesk.apk

      - name: Publish to Releases (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NerdyDesk (latest build)
          body: Download NerdyDesk.apk below and install it. Each push rebuilds this file.
          files: out/NerdyDesk.apk
          make_latest: true
